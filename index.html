<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Pulsar Strike</title>
		<style>
			html,
			body,
			#app {
				height: 100%;
				margin: 0;
				background: #000;
				overflow: hidden;
			}
			#hud {
				position: fixed;
				inset: 0 0 auto 0;
				z-index: 10;
				display: none;
				pointer-events: none;
			}
			#hud .top-bars {
				position: fixed;
				inset: 0 0 auto 0;
				display: grid;
				grid-template-rows: repeat(2, minmax(0, 1fr));
				height: 14px;
				background: rgba(3, 8, 18, 0.82);
				border-bottom: 1px solid rgba(255, 255, 255, 0.08);
				box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
			}
			#hud .bar {
				position: relative;
				overflow: hidden;
				background: rgba(255, 255, 255, 0.06);
			}
			#hud .bar + .bar {
				border-top: 1px solid rgba(255, 255, 255, 0.06);
			}
			#hud .bar-fill {
				height: 100%;
				width: 0%;
				transition: width 120ms linear;
			}
			#hud .bar-fill.health {
				background: linear-gradient(90deg, #ff3b72 0%, #ff6f9e 100%);
				box-shadow: 0 0 18px rgba(255, 59, 114, 0.4);
			}
			#hud .bar-fill.shield {
				background: linear-gradient(90deg, #21b8ff 0%, #33ffdd 100%);
				box-shadow: 0 0 18px rgba(51, 255, 221, 0.35);
			}
			#hud .hud-readout {
				position: fixed;
				top: 22px;
				left: 12px;
				right: 12px;
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: 12px;
				color: #dbe7ff;
				font: 700 13px/1.2 monospace;
			}
			#hud .stats {
				display: flex;
				flex-direction: column;
				gap: 4px;
				text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
			}
			#hud .stat {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			#hud .stat-label {
				min-width: 52px;
				color: rgba(219, 231, 255, 0.72);
				text-transform: uppercase;
				letter-spacing: 0.08em;
				font-size: 11px;
			}
			#hud .controls {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			#hud .btn {
				pointer-events: auto;
				color: #fff;
				border: 1px solid rgba(255, 255, 255, 0.28);
				background: rgba(5, 10, 20, 0.72);
				padding: 6px 10px;
				display: inline-block;
				cursor: pointer;
				text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
			}
			@media (max-width: 640px) {
				#hud .top-bars {
					height: 12px;
				}
				#hud .hud-readout {
					top: 18px;
					left: 10px;
					right: 10px;
					font-size: 12px;
				}
				#hud .stat-label {
					min-width: 46px;
				}
				#hud .btn {
					padding: 5px 9px;
				}
			}
			#overlay .btn {
				background: #111;
				color: #ddd;
				border: 1px solid #444;
				padding: 6px 12px;
				margin: 4px;
				cursor: pointer;
			}
			#overlay .btn.active {
				border-color: #0f0;
				color: #0f0;
				box-shadow: 0 0 8px rgba(0, 255, 0, 0.35);
			}
			#overlay .restart-btn {
				background: #111;
				color: #ddd;
				border: 1px solid #444;
				padding: 6px 12px;
				cursor: pointer;
			}
			#pause-controls {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 14px;
			}
			#pause-title {
				margin-bottom: 20px;
			}
			#pause-countdown {
				min-height: 1em;
				margin-bottom: 20px;
				font-size: 56px;
				line-height: 1;
				color: #9dff9d;
				text-shadow: 0 0 16px rgba(157, 255, 157, 0.45);
			}
			#pause-mode-controls {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 8px;
			}
			#game-over {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: rgba(0, 0, 0, 0.7);
				color: #fff;
				font: 700 32px/1.2 monospace;
				z-index: 11;
				flex-direction: column;
				text-align: center;
				padding: 24px;
				box-sizing: border-box;
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
				transition: opacity 220ms ease-out;
			}
			#game-over.is-visible {
				opacity: 1;
				visibility: visible;
				pointer-events: auto;
			}
			#game-over .score {
				font-size: 24px;
				margin: 12px 0 20px;
			}
			#game-over .btn,
			#game-over .restart-btn {
				background: #111;
				color: #ddd;
				border: 1px solid #444;
				padding: 6px 12px;
				margin: 4px;
				cursor: pointer;
			}
			#game-over .btn.active {
				border-color: #0f0;
				color: #0f0;
				box-shadow: 0 0 8px rgba(0, 255, 0, 0.35);
			}
			#game-over .buttons {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 12px;
			}
			#start-screen,
			#game-over {
				box-sizing: border-box;
				padding: 24px;
			}
			#start-screen {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background:
					radial-gradient(circle at 20% 20%, hsla(0, 0%, 100%, 0), transparent 50%),
					radial-gradient(circle at 80% 80%, #ffffff00, transparent 48%), rgba(0, 0, 0, 0.86);
				color: #fff;
				font: 700 28px/1.2 monospace;
				z-index: 12;
				text-align: center;
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
				transition: opacity 220ms ease-out;
			}
			#start-screen.is-visible {
				opacity: 1;
				visibility: visible;
				pointer-events: auto;
			}
			#start-screen .panel {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 16px;
				padding: 28px 24px;
				min-width: 280px;
				background: rgba(8, 14, 26, 0.9);
				border: 1px solid rgba(0, 255, 0, 0.35);
				box-shadow: 0 0 28px rgba(0, 120, 255, 0.24);
			}
			#start-screen .title {
				letter-spacing: 1px;
				text-transform: uppercase;
			}
			#start-screen .best {
				font-size: 18px;
				font-weight: 500;
			}
			#start-screen .btn,
			#start-screen .restart-btn {
				background: #111;
				color: #ddd;
				border: 1px solid #444;
				padding: 6px 12px;
				margin: 4px;
				cursor: pointer;
			}
			#start-screen .btn.active {
				border-color: #0f0;
				color: #0f0;
				box-shadow: 0 0 8px rgba(0, 255, 0, 0.35);
			}
			#start-controls {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 8px;
			}
			#game-over-controls {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 8px;
			}
			.item-hints {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				box-sizing: border-box;
				background: rgba(0, 0, 0, 0.74);
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
				transition: opacity 180ms ease-out;
				z-index: 20;
			}
			.item-hints.is-visible {
				opacity: 1;
				visibility: visible;
				pointer-events: auto;
			}
			.item-hints-panel {
				width: min(560px, 100%);
				max-height: min(80vh, 720px);
				overflow: auto;
				background: rgba(8, 14, 26, 0.96);
				border: 1px solid rgba(51, 255, 221, 0.45);
				box-shadow: 0 0 32px rgba(0, 120, 255, 0.18);
				padding: 22px 20px 18px;
				color: #e7efff;
				font: 700 16px/1.35 monospace;
			}
			.item-hints-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				margin-bottom: 16px;
			}
			.item-hints-title {
				font-size: 22px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
			}
			.item-hints-close,
			.item-hints-trigger {
				background: #111;
				color: #ddd;
				border: 1px solid #444;
				cursor: pointer;
				font: inherit;
			}
			.item-hints-list {
				list-style: none;
				padding: 0;
				margin: 0;
				display: flex;
				flex-direction: column;
				gap: 12px;
			}
			.item-hint {
				padding: 10px 12px;
				background: rgba(255, 255, 255, 0.04);
				border: 1px solid rgba(255, 255, 255, 0.08);
			}
			.item-hint-header {
				display: flex;
				align-items: flex-start;
				gap: 12px;
			}
			.item-hint-shape {
				flex: 0 0 auto;
				filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.16));
			}
			.item-hint-copy {
				display: flex;
				flex-direction: column;
				gap: 3px;
				min-width: 0;
			}
			.item-hint-name {
				font-size: 17px;
			}
			.item-hint-meta {
				font-size: 12px;
				color: rgba(231, 239, 255, 0.62);
				text-transform: uppercase;
				letter-spacing: 0.06em;
			}
			.item-hint-description {
				font-size: 13px;
				color: rgba(231, 239, 255, 0.8);
			}
			@media (max-width: 640px) {
				.item-hints {
					padding: 14px;
				}
				.item-hints-panel {
					padding: 18px 16px 14px;
					font-size: 14px;
				}
				.item-hints-title {
					font-size: 18px;
				}
				.item-hint-name {
					font-size: 15px;
				}
				.item-hint-meta {
					font-size: 11px;
				}
			}
		</style>

				<button class="btn" type="button" data-sound-toggle aria-pressed="true">Sound On</button>
				<button class="btn" type="button" data-open-item-hints>Hints</button>
				<button class="restart-btn" id="restart">Restart</button>
			</div>
		</div>

		<div id="game-over">
			<div>GAME OVER</div>
			<div class="score">
				Final score:
				<span id="final-score">0</span>
			</div>
			<div class="buttons">
				<button class="restart-btn" id="play-again">Play Again</button>
				<button class="btn" type="button" data-open-item-hints>Hints</button>
				<div id="game-over-controls">
					<button class="btn" data-mode="easy">Easy</button>
					<button class="btn" data-mode="normal">Normal</button>
					<button class="btn" data-mode="hard">Hard</button>
				</div>
			</div>
		</div>
		<div class="item-hints" id="item-hints">
			<div class="item-hints-panel" role="dialog" aria-modal="true" aria-labelledby="item-hints-title">
				<div class="item-hints-header">
					<div class="item-hints-title" id="item-hints-title">Hints</div>
					<button class="item-hints-close" type="button" data-close-item-hints>Close</button>
				</div>
				<ul class="item-hints-list" id="item-hints-list"></ul>
			</div>
		</div>

	</body>
</html>
